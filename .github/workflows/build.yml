name: Build apps

# Unsigned builds of the desktop app for macOS, Windows and Linux, from any branch, with no
# signing accounts: run it from the Actions tab. Each job runs the same packaging script the
# release workflow uses (packaging/<os>/package.*), which falls back to ad-hoc signing on macOS
# and to unsigned files on Windows when no certificate is configured. The files are kept as run
# artifacts and, unless `publish` is off, attached to a pre-release named after the run.
#
# First launch of an unsigned build: macOS Gatekeeper shows "cannot be opened" and offers Move to
# Trash; click Done, then System Settings ▸ Privacy & Security ▸ Open Anyway (or remove the
# quarantine flag: `xattr -dr com.apple.quarantine /Applications/PDFKraft.app`). Windows
# SmartScreen shows "Windows protected your PC"; click More info ▸ Run anyway.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the files to a pre-release named after this run"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The same craft-fonts commit as release.yml: Japanese, Chinese, Arabic, Thai, Hebrew and
  # Devanagari faces. Khmer is bundled in this repository and needs no input.
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PDFKraft $version"

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      - name: Install build and packaging tools (nfpm, windowing and GPU headers)
        uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: amd64
      - name: Install the windowing and GTK headers the app links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-linux-x86_64
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          ls -la dist/release
          dpkg-deb --info dist/release/*.deb || true
          for appimage in dist/release/*.AppImage; do
            if [ -f "$appimage" ]; then
              chmod +x "$appimage"
              APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfkraft-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal (unsigned)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-macos-universal
      - name: Build and package (ad-hoc signed .dmg, not notarized)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - name: List the files
        run: ls -la dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfkraft-macos-universal
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64 (unsigned)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-windows-x64
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
      - name: Build and package (.msi and portable .zip, unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: List the files
        shell: pwsh
        run: Get-ChildItem dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfkraft-windows-x64
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Pre-release with the files
    if: inputs.publish && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="build-${RUN}"
          ls -R files
          notes="Unsigned build of PDFKraft ${VERSION} from ${BRANCH} (${SHA:0:12}), run ${RUN}.

          - macOS: open the .dmg, drag PDFKraft to Applications. The app is ad-hoc signed and not notarized: on first launch click Done on the Gatekeeper message, then System Settings ▸ Privacy & Security ▸ Open Anyway (or run \`xattr -dr com.apple.quarantine /Applications/PDFKraft.app\`).
          - Windows: the .msi installs PDFKraft; the portable .zip runs without installing. SmartScreen: More info ▸ Run anyway.
          - Linux: AppImage (chmod +x, then run), .deb, .rpm or the tarball; pdfkraft-cli is in its own archive.

          Khmer text: Edit ▸ Add text, type with a Khmer keyboard, choose a Khmer font in the format panel."
          gh release create "$tag" --prerelease --target "$SHA" --title "PDFKraft ${VERSION} build ${RUN} (unsigned)" --notes "$notes" files/*/*
