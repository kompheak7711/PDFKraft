name: CI

# The checks that matter for PDFKraft's own changes, in minutes rather than hours: formatting,
# the asset policy, clippy and the tests of the crates that carry the Khmer work (fonts, edit,
# automation). The full upstream gate, fuzzing and the extra platforms are not run here; the
# Build apps workflow builds the three desktop apps on demand.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, assets, clippy, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the headers the engine crates' dependencies link against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci
      - name: Formatting
        run: cargo fmt --check
      - name: Asset policy (every font and icon attributed and hashed)
        run: cargo xtask assets
      - name: Clippy
        run: cargo clippy -p pdfkraft-fonts -p pdfkraft-edit -p pdfkraft-automation --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test -p pdfkraft-fonts -p pdfkraft-edit -p pdfkraft-automation --locked
