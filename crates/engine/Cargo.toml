[package]
name = "pdfkraft-engine"
description = "PDFKraft engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
pdfkraft-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
pdfkraft-render = { workspace = true }
pdfkraft-cos = { workspace = true }
pdfkraft-organize = { workspace = true }
pdfkraft-annot = { workspace = true }
pdfkraft-forms = { workspace = true }
pdfkraft-xfa = { workspace = true }
pdfkraft-edit = { workspace = true }
pdfkraft-audit = { workspace = true }
pdfkraft-redact = { workspace = true }
pdfkraft-print = { workspace = true }
pdfkraft-xfdf = { workspace = true }
pdfkraft-sign = { workspace = true }
pdfkraft-optimize = { workspace = true }
pdfkraft-a11y = { workspace = true }
pdfkraft-ocr = { workspace = true }
pdfkraft-js = { workspace = true }
pdfkraft-compare = { workspace = true }
pdfkraft-preflight = { workspace = true }
pdfkraft-export = { workspace = true }
pdfkraft-fonts = { workspace = true }
pdfkraft-create = { workspace = true }
pdfkraft-model = { workspace = true }
pdfkraft-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and pdfkraft-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
pdfkraft-testkit = { workspace = true }
